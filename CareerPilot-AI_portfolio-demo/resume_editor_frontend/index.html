<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
:root{--font:'Arial';--body:10pt;--name:21pt;--section:11.5pt;--line:1.18;--page-pad:16mm;--section-gap:10px;--item-gap:7px;--paragraph-gap:3px}
*{box-sizing:border-box}html,body{margin:0;background:transparent;font-family:var(--font),"PingFang SC","Microsoft YaHei",sans-serif;color:#161616}
.shell{background:#f4f4f2;border:1px solid #e2e2df;border-radius:18px;padding:10px;overflow:hidden}
.toolbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding:8px;border:1px solid #dededb;border-radius:12px;background:rgba(255,255,255,.98);box-shadow:0 5px 18px rgba(20,20,20,.04);margin-bottom:10px}
.toolbar button,.toolbar select,.toolbar input{height:32px;border:0;border-radius:8px;background:transparent;color:#292929;padding:0 8px;font-size:13px}.toolbar button:hover,.toolbar select:hover{background:#eeeeec}.toolbar button.active{background:#171717;color:white}.sep{width:1px;height:20px;background:#ddddda;margin:0 3px}.toolbar label{display:flex;align-items:center;gap:4px;color:#666;font-size:10px}.toolbar input[type=number]{width:52px;background:#f2f2f0}
.editor-wrap{display:flex;justify-content:center;overflow:auto;padding:4px 0 18px}.page-stage{position:relative;width:210mm;flex:0 0 210mm}
.resume{position:relative;z-index:1;width:210mm;min-height:297mm;background:white;padding:var(--page-pad);box-shadow:0 18px 50px rgba(28,24,18,.09);outline:none;font-family:var(--font),"PingFang SC","Microsoft YaHei",sans-serif!important;font-size:var(--body)!important;line-height:var(--line);overflow-wrap:anywhere}
.page-guides{position:absolute;z-index:4;inset:0;pointer-events:none}.page-guide{position:absolute;left:0;right:0;height:0;border-top:6px solid #ececea;box-shadow:0 -1px 0 #d5d5d1,0 1px 0 #fff}.page-guide .footer-zone,.page-guide .header-zone{position:absolute;left:0;right:0;height:var(--page-pad);background:rgba(224,242,254,.16);border-color:rgba(110,158,216,.24);color:#6283a8;font-size:8px;font-weight:700;letter-spacing:.03em}.page-guide .footer-zone{bottom:3px;border-top:1px dashed rgba(110,158,216,.28)}.page-guide .header-zone{top:3px;border-bottom:1px dashed rgba(110,158,216,.28)}.page-guide .footer-zone span{position:absolute;right:10px;bottom:5px}.page-guide .header-zone span{position:absolute;right:10px;top:5px}.page-badge{position:absolute;right:11px;z-index:5;padding:3px 7px;border-radius:99px;background:#edf5ff;color:#4775aa;font-size:8px;font-weight:700;pointer-events:none}.auto-page-break{display:block;width:100%;margin:0!important;padding:0!important;border:0!important;pointer-events:none;user-select:none;-webkit-user-select:none}
.resume:focus{box-shadow:0 18px 50px rgba(28,24,18,.11),0 0 0 2px rgba(30,120,80,.18)}
.resume p,.resume li,.resume .row,.resume .subrow,.resume .skills{font-family:var(--font),SimSun,"Songti SC","PingFang SC",serif!important;font-size:var(--body)!important}.resume p *,.resume li *,.resume .row *,.resume .subrow *,.resume .skills *{font-family:inherit!important;font-size:inherit!important}.resume h1,.resume h1 *{font-family:var(--font),SimSun,"Songti SC",serif!important;font-size:var(--name)!important;line-height:1.05;text-align:center;margin:0 0 2px;font-weight:500}.contact{text-align:center;margin:0;color:#222;line-height:1.12}.contact-secondary{margin-bottom:4px}.resume h2,.resume h2 *{font-family:var(--font),SimSun,"Songti SC",serif!important;font-size:var(--section)!important}.resume h2{line-height:1.12;margin:var(--section-gap) 0 2px;padding-bottom:1px;border-bottom:1px solid #222;font-weight:750}.entry{margin:0 0 var(--item-gap);break-inside:avoid}.row{display:flex;justify-content:space-between;gap:18px;align-items:baseline;line-height:1.12}.row strong,.row .right{font-weight:750}.right{white-space:nowrap;text-align:right}.subrow{display:flex;justify-content:space-between;gap:18px;align-items:baseline;line-height:1.12}.subrow .left{font-weight:400}.resume p{margin:0 0 var(--paragraph-gap)}.resume ul{margin:1px 0 0;padding-left:16px}.resume li{margin:0 0 var(--paragraph-gap);padding-left:1px}.skills{margin:2px 0}.inline-link{color:#0645ad;text-decoration:underline}.page-break{break-before:page;border-top:1px dashed #ddd;margin:18px -8px 8px;padding-top:8px;color:#aaa;font-size:9px;text-align:center}.editing-hint{display:none}
.resume .entry-link{color:#444;font-size:9pt!important}.resume .entry-link a{color:#176f65;text-decoration:underline;text-underline-offset:2px}
.review-mode .change-marker{position:relative;background:#e9f4ff;border-left:3px solid #6e9ed8;padding-left:7px;margin-left:-10px}.review-mode .change-marker::after{content:'AI 修改';position:absolute;right:4px;top:-8px;font-size:7px;line-height:1;color:#4775aa;background:#edf5ff;border:1px solid #c6daf2;border-radius:99px;padding:2px 5px}.readonly-mode .resume{cursor:text}.readonly-mode .toolbar .edit-control{display:none}.mode-label{display:none;font-size:11px;font-weight:700;color:#4775aa;background:#edf5ff;border-radius:99px;padding:7px 10px}.readonly-mode .mode-label{display:inline-flex}
@media(max-width:900px){.shell{border-radius:14px}.editor-wrap{justify-content:flex-start}}
@page{size:A4 portrait;margin:16mm}
@media print{html,body{width:auto!important;height:auto!important;background:white}.shell{padding:0;background:white;border:0;overflow:visible}.toolbar{display:none!important}.editor-wrap,.page-stage{display:block;padding:0;overflow:visible;width:auto}.resume{box-shadow:none;width:auto;min-height:0!important;padding:0;overflow:visible}.page-guides,.page-badge{display:none!important}.auto-page-break{height:0!important;break-before:page}.change-marker{background:transparent!important;border:0!important;padding-left:0!important;margin-left:0!important}.change-marker::after{display:none!important}.page-break{border:0;margin:0;padding:0;color:transparent;break-before:page}}
</style>
</head>
<body>
<div class="shell">
  <div class="toolbar" id="toolbar">
    <span class="mode-label" id="modeLabel">审阅模式</span>
    <span class="edit-control"><button data-cmd="undo" title="撤销">↶</button><button data-cmd="redo" title="恢复">↷</button></span><span class="sep edit-control"></span>
    <select class="edit-control" id="fontName"><option value="Arial">Arial</option><option value="Calibri">Calibri</option><option value="Times New Roman">Times New Roman</option><option value="PingFang SC">苹方</option><option value="Microsoft YaHei">微软雅黑</option><option value="SimSun">宋体</option><option value="Kaiti SC">楷体</option></select>
    <select class="edit-control" id="fontSize" title="整份简历正文字号"><option value="9">9 pt</option><option value="9.5">9.5 pt</option><option value="10" selected>10 pt</option><option value="10.5">10.5 pt</option><option value="11">11 pt</option><option value="12">12 pt</option><option value="14">14 pt</option></select>
    <span class="edit-control"><button data-cmd="bold"><b>B</b></button><button data-cmd="italic"><i>I</i></button><button data-cmd="underline"><u>U</u></button></span>
    <input class="edit-control" id="foreColor" type="color" value="#161616" title="文字颜色" style="width:36px;padding:4px"/><span class="sep edit-control"></span>
    <span class="edit-control"><button data-cmd="insertUnorderedList">• 列表</button><button data-cmd="insertOrderedList">1. 列表</button><button data-cmd="outdent">←</button><button data-cmd="indent">→</button></span><span class="sep edit-control"></span>
    <span class="edit-control"><button data-cmd="justifyLeft">左</button><button data-cmd="justifyCenter">中</button><button data-cmd="justifyRight">右</button></span><span class="sep edit-control"></span>
    <label class="edit-control">行距 <input id="lineHeight" type="number" min="1" max="2" step="0.05" value="1.18"></label>
    <label class="edit-control">段距 <input id="paragraphGap" type="number" min="0" max="16" step="1" value="3"></label>
    <label class="edit-control">条目距 <input id="itemGap" type="number" min="0" max="20" step="1" value="7"></label>
    <label class="edit-control">正文 <input id="bodySize" type="number" min="8" max="14" step="0.5" value="10"></label>
    <label class="edit-control">姓名 <input id="nameSize" type="number" min="14" max="30" step="1" value="21"></label>
    <label class="edit-control">页边距 <input id="pagePad" type="number" min="8" max="28" step="1" value="16"></label>
    <span class="edit-control"><button id="linkBtn">链接</button><button id="breakBtn">分页</button></span><button id="printBtn">导出 PDF / 打印</button>
  </div>
  <div class="editor-wrap"><div class="page-stage" id="pageStage"><article id="editor" class="resume" contenteditable="true" spellcheck="false"></article><div class="page-guides" id="pageGuides"></div></div></div>
</div>
<script>
const editor=document.getElementById('editor');const pageStage=document.getElementById('pageStage');const pageGuides=document.getElementById('pageGuides');let initialized=false,lastSent='',selectedText='',selectionId=0,pageCount=1,paginating=false,lastHeight=0,layoutFrame=0,lastDocumentVersion=null;
function send(type,data){window.parent.postMessage({isStreamlitMessage:true,type:type,...data},'*')}
function setHeight(){const shell=document.querySelector('.shell');const natural=shell?Math.ceil(shell.scrollHeight+8):780;const height=Math.min(6000,Math.max(780,natural));if(Math.abs(height-lastHeight)<2)return;lastHeight=height;send('streamlit:setFrameHeight',{height})}
function currentSettings(){return{font:document.getElementById('fontName').value,body_size:Number(document.getElementById('bodySize').value),name_size:Number(document.getElementById('nameSize').value),section_size:11.5,line_height:Number(document.getElementById('lineHeight').value),page_margin:Number(document.getElementById('pagePad').value),section_gap:10,item_gap:Number(document.getElementById('itemGap').value),paragraph_gap:Number(document.getElementById('paragraphGap').value)}}
function cleanEditorHtml(){const clone=editor.cloneNode(true);clone.querySelectorAll('.auto-page-break').forEach(node=>node.remove());return clone.innerHTML}
function updatePagination(){if(paginating)return pageCount;paginating=true;editor.querySelectorAll(':scope > .auto-page-break').forEach(node=>node.remove());editor.style.minHeight='297mm';pageStage.style.minHeight='297mm';const pagePx=editor.getBoundingClientRect().width*(297/210);const marginMm=Number(document.getElementById('pagePad').value)||16;const marginPx=editor.getBoundingClientRect().width*(marginMm/210);let pageIndex=0;const blocks=Array.from(editor.children);for(const block of blocks){if(block.classList.contains('auto-page-break'))continue;while(block.offsetTop>=(pageIndex+1)*pagePx)pageIndex+=1;const printableTop=pageIndex*pagePx+marginPx;const printableBottom=(pageIndex+1)*pagePx-marginPx;const blockBottom=block.offsetTop+block.getBoundingClientRect().height;if(blockBottom>printableBottom&&block.offsetTop>printableTop+2){const spacer=document.createElement('div');spacer.className='auto-page-break';spacer.contentEditable='false';const targetTop=(pageIndex+1)*pagePx+marginPx;spacer.style.height=Math.max(0,targetTop-block.offsetTop)+'px';editor.insertBefore(spacer,block);pageIndex+=1}}pageCount=Math.max(1,pageIndex+1,Math.ceil((editor.scrollHeight-2)/pagePx));editor.style.minHeight=(pageCount*297)+'mm';pageStage.style.minHeight=(pageCount*297)+'mm';pageGuides.innerHTML='';for(let i=1;i<pageCount;i++){const line=document.createElement('div');line.className='page-guide';line.style.top=(i*297)+'mm';line.innerHTML='<div class="footer-zone"><span>第 '+i+' 页页脚安全区 · '+marginMm+' mm</span></div><div class="header-zone"><span>第 '+(i+1)+' 页页眉安全区 · '+marginMm+' mm</span></div>';pageGuides.appendChild(line)}for(let i=1;i<=pageCount;i++){const badge=document.createElement('div');badge.className='page-badge';badge.style.top='calc('+(i*297)+'mm - 22px)';badge.textContent='第 '+i+' / '+pageCount+' 页';pageGuides.appendChild(badge)}paginating=false;return pageCount}
function stateSignature(html=cleanEditorHtml()){return html+JSON.stringify(currentSettings())+selectedText+selectionId+pageCount}
function emit(force=false){updatePagination();const html=cleanEditorHtml();const signature=stateSignature(html);if(!force&&signature===lastSent)return;lastSent=signature;send('streamlit:setComponentValue',{value:{html,settings:currentSettings(),selected_text:selectedText,selection_id:selectionId,page_count:pageCount},dataType:'json'});setHeight()}
function scheduleLayout(){if(layoutFrame)return;layoutFrame=requestAnimationFrame(()=>{layoutFrame=0;updatePagination();setHeight()})}
function fontStack(name){return{'Arial':'Arial','Calibri':'Calibri,Arial','Times New Roman':'"Times New Roman"','PingFang SC':'"PingFang SC","Microsoft YaHei"','Microsoft YaHei':'"Microsoft YaHei","PingFang SC"','SimSun':'SimSun,"Songti SC"','Kaiti SC':'"Kaiti SC",KaiTi'}[name]||name||'Arial'}
function applySettings(s={}){const r=document.documentElement.style;r.setProperty('--font',fontStack(s.font));r.setProperty('--body',(s.body_size||10)+'pt');r.setProperty('--name',(s.name_size||21)+'pt');r.setProperty('--section',(s.section_size||11.5)+'pt');r.setProperty('--line',s.line_height||1.18);r.setProperty('--page-pad',(s.page_margin||16)+'mm');r.setProperty('--section-gap',(s.section_gap||10)+'px');r.setProperty('--item-gap',(s.item_gap??7)+'px');r.setProperty('--paragraph-gap',(s.paragraph_gap??3)+'px');document.getElementById('lineHeight').value=s.line_height||1.18;document.getElementById('paragraphGap').value=s.paragraph_gap??3;document.getElementById('itemGap').value=s.item_gap??7;document.getElementById('bodySize').value=s.body_size||10;document.getElementById('fontSize').value=String(s.body_size||10);document.getElementById('nameSize').value=s.name_size||21;document.getElementById('pagePad').value=s.page_margin||16;document.getElementById('fontName').value=s.font||'Arial';requestAnimationFrame(updatePagination)}
function plainText(v){return(v||'').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim()}
function applyMode(mode,baseHtml){document.body.classList.toggle('readonly-mode',mode!=='edit');document.body.classList.toggle('review-mode',mode==='review');editor.contentEditable=mode==='edit'?'true':'false';document.getElementById('modeLabel').textContent=mode==='review'?'AI 修改审阅':mode==='preview'?'干净 A4 预览':'只读对比';editor.querySelectorAll('.change-marker').forEach(n=>n.classList.remove('change-marker'));if(mode==='review'){const box=document.createElement('div');box.innerHTML=baseHtml||'';const baseSet=new Set(Array.from(box.querySelectorAll('li,p,.row strong,.subrow .left')).map(n=>plainText(n.innerHTML)).filter(Boolean));editor.querySelectorAll('li,p,.row strong,.subrow .left').forEach(n=>{const t=plainText(n.innerHTML);if(t&&!baseSet.has(t))n.classList.add('change-marker')})}}
window.addEventListener('message',e=>{const d=e.data;if(d?.type!=='streamlit:render')return;const args=d.args||{};const documentVersion=String(args.document_version||'');applySettings(args.settings||{});if(!initialized||documentVersion!==lastDocumentVersion){editor.innerHTML=args.value||'';initialized=true;lastDocumentVersion=documentVersion;applyMode(args.mode||'edit',args.base_value||'');requestAnimationFrame(()=>{updatePagination();lastSent=stateSignature();setHeight()});return}applyMode(args.mode||'edit',args.base_value||'');scheduleLayout()})
send('streamlit:componentReady',{apiVersion:1});
document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>{editor.focus();document.execCommand(b.dataset.cmd,false,null);emit()});
document.getElementById('fontName').onchange=e=>{document.documentElement.style.setProperty('--font',fontStack(e.target.value));emit(true)};
document.getElementById('fontSize').onchange=e=>{document.getElementById('bodySize').value=e.target.value;document.documentElement.style.setProperty('--body',e.target.value+'pt');emit(true)};
document.getElementById('foreColor').onchange=e=>{editor.focus();document.execCommand('foreColor',false,e.target.value);emit()};
let settingsTimer;function queueSettingsEmit(input,apply){if(input.value==='')return;apply(input.value);clearTimeout(settingsTimer);settingsTimer=setTimeout(()=>emit(true),320)}
document.getElementById('lineHeight').oninput=e=>queueSettingsEmit(e.target,v=>document.documentElement.style.setProperty('--line',v));
document.getElementById('paragraphGap').oninput=e=>queueSettingsEmit(e.target,v=>document.documentElement.style.setProperty('--paragraph-gap',v+'px'));
document.getElementById('itemGap').oninput=e=>queueSettingsEmit(e.target,v=>document.documentElement.style.setProperty('--item-gap',v+'px'));
document.getElementById('bodySize').oninput=e=>queueSettingsEmit(e.target,v=>{document.getElementById('fontSize').value=v;document.documentElement.style.setProperty('--body',v+'pt')});
document.getElementById('nameSize').oninput=e=>queueSettingsEmit(e.target,v=>document.documentElement.style.setProperty('--name',v+'pt'));
document.getElementById('pagePad').oninput=e=>queueSettingsEmit(e.target,v=>document.documentElement.style.setProperty('--page-pad',v+'mm'));
document.getElementById('linkBtn').onclick=()=>{const u=prompt('输入链接地址');if(u){editor.focus();document.execCommand('createLink',false,u);emit()}};
document.getElementById('breakBtn').onclick=()=>{editor.focus();document.execCommand('insertHTML',false,'<div class="page-break">分页</div>');emit()};
document.getElementById('printBtn').onclick=()=>window.print();
function captureSelection(){const selection=window.getSelection();if(!selection||selection.isCollapsed)return;const anchor=selection.anchorNode,focus=selection.focusNode;if(!editor.contains(anchor)||!editor.contains(focus))return;const next=selection.toString().replace(/\s+/g,' ').trim().slice(0,600);if(next){selectedText=next;selectionId=Date.now();emit(true)}}
let selectionTimer;document.addEventListener('selectionchange',()=>{clearTimeout(selectionTimer);selectionTimer=setTimeout(captureSelection,80)});
let timer;editor.addEventListener('input',()=>{if(editor.contentEditable!=='true')return;clearTimeout(timer);timer=setTimeout(()=>emit(true),500)});editor.addEventListener('mouseup',()=>setTimeout(captureSelection,0));editor.addEventListener('keyup',e=>{if(e.shiftKey)setTimeout(captureSelection,0)});editor.addEventListener('blur',()=>{if(editor.contentEditable==='true')emit()});new ResizeObserver(scheduleLayout).observe(document.querySelector('.shell'));window.addEventListener('resize',scheduleLayout,{passive:true});
</script>
</body>
</html>
